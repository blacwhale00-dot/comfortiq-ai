<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to a real
         value on notched devices — without it the inset is always 0 and the
         safe-area padding in Layout.tsx silently does nothing. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>GuzzlerScore — Know Your Score Before You Get a Quote</title>
    <meta name="description" content="Get your home's free GuzzlerScore — your HVAC system's health and efficiency rating, in minutes, with no salesman and no pressure." />
    <meta name="author" content="GuzzlerScore" />

    <!-- Unfurl card for shared links. Facebook's share dialog ignores any
         caption passed to it and builds its preview from these tags alone, so
         this block IS the Facebook share copy (see src/lib/share-score.ts).
         og:image must be an absolute URL — relative paths are not resolved by
         the scrapers — and is required for twitter:card=summary_large_image to
         render as a large card rather than a bare link. -->
    <meta property="og:site_name" content="GuzzlerScore" />
    <meta property="og:title" content="GuzzlerScore — Know Your Score Before You Get a Quote" />
    <meta property="og:description" content="Get your home's free GuzzlerScore — your HVAC system's health and efficiency rating, in minutes, with no salesman and no pressure." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://guzzlerscore.ai/" />
    <meta property="og:image" content="https://guzzlerscore.ai/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Guzzler Score — your home's HVAC efficiency rating" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GuzzlerScore — Know Your Score Before You Get a Quote" />
    <meta name="twitter:description" content="Get your home's free GuzzlerScore — your HVAC system's health and efficiency rating, in minutes, with no salesman and no pressure." />
    <meta name="twitter:image" content="https://guzzlerscore.ai/og-card.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
